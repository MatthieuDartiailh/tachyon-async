name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # tachyon-sys vendor code uses C++23 features (e.g., std::unexpected)
      # and Clang-style __has_feature() macro usage that require g++-14 or newer.
      # The default g++ on ubuntu-latest is g++-13 which fails to compile them.
      CXX: g++-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust workspace dependencies
        run: cargo fetch

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace
